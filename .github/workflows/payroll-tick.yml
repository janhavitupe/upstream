# Wakes the Render app once a day so monthly payroll runs on time even while the free
# instance sleeps. The check only does what each schedule allows (previews in the heads-up
# window, payments on or after payday) and never pays twice, so running it is always safe.
# Setup: repo Settings -> Secrets and variables -> Actions -> Variables -> UPSTREAM_URL
# (e.g. https://upstream-xxxx.onrender.com)
name: Payroll daily check

on:
  schedule:
    - cron: "0 6 * * *"  # 06:00 UTC (11:30 IST) every day
  workflow_dispatch:

jobs:
  tick:
    runs-on: ubuntu-latest
    if: ${{ vars.UPSTREAM_URL != '' }}
    steps:
      - name: Run the payroll scheduler
        run: |
          # A sleeping free instance takes up to a minute to wake: retry patiently
          curl -fsS --retry 6 --retry-delay 20 --retry-all-errors --max-time 120 \
            -X POST "${{ vars.UPSTREAM_URL }}/api/payroll/tick"
