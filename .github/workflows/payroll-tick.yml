# Keeps the Render app on time while the free instance sleeps. Every payroll schedule keeps its
# own day, time and time zone in the database; the app checks them all every minute while it's
# awake, and this wakes it every 15 minutes so nobody's payday is missed. It also runs invoice
# chasing and retainer heads-ups. Each check only does what's due and never pays twice.
# Setup: repo Settings -> Secrets and variables -> Actions -> Variables -> UPSTREAM_URL
# (e.g. https://upstream-xxxx.onrender.com)
name: Wake-up check (payroll, invoice chasing, retainers)

on:
  schedule:
    - cron: "*/15 * * * *"  # every 15 minutes (GitHub may start runs a few minutes late)
  workflow_dispatch:

jobs:
  tick:
    runs-on: ubuntu-latest
    if: ${{ vars.UPSTREAM_URL != '' }}
    steps:
      - name: Run everything that is due
        run: |
          # A sleeping free instance takes up to a minute to wake: retry patiently
          curl -fsS --retry 6 --retry-delay 20 --retry-all-errors --max-time 120 \
            -X POST "${{ vars.UPSTREAM_URL }}/api/tick"
